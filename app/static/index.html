<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delhi Bus Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#fff; --fg:#1d2433; --muted:#667085; --line:#e4e7ec; --seat:#1a7f4b; --stand:#b7791f; --crowd:#c0392b; --unk:#98a2b3; --accent:#2457c5; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif; color:var(--fg); background:var(--bg); }
  .wrap { display:grid; grid-template-columns: 380px 1fr; height:100vh; }
  aside { border-right:1px solid var(--line); overflow:auto; padding:16px; }
  #map { height:100vh; }
  h1 { font-size:17px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  input, select, button { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; width:100%; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; margin-top:10px; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .opt { border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:10px; cursor:pointer; }
  .opt.sel { border-color:var(--accent); box-shadow:0 0 0 2px #2457c522; }
  .big { font-size:18px; font-weight:600; }
  .leg { margin:6px 0 0 0; padding-left:10px; border-left:3px solid var(--line); font-size:13px; }
  .badge { display:inline-block; padding:0 6px; border-radius:10px; color:#fff; font-size:12px; }
  .b-座れる { background:var(--seat); } .b-立つ { background:var(--stand); } .b-混雑 { background:var(--crowd); } .b-不明 { background:var(--unk); }
  .muted { color:var(--muted); font-size:12px; }
  .hint { background:#f5f7fa; border-radius:6px; padding:8px; font-size:12px; color:var(--muted); }
  @media (max-width: 800px) { .wrap { grid-template-columns:1fr; grid-template-rows:auto 50vh; height:auto; } #map{height:50vh;} aside{border-right:none;} }
</style>
</head>
<body>
<div class="wrap">
<aside>
  <h1>Delhi Bus Journey Planner</h1>
  <div class="sub">Times are learned from real bus GPS (Oct 2026) and live positions, not the timetable. Crowding is estimated from e-tickets. <a href="/passages">Inspect stop passages on the map →</a></div>
  <div class="hint">Click the map once to set the origin, and again to set the destination.</div>
  <div class="row">
    <div><label>From (lat,lng)</label><input id="from" value="28.6676,77.2285"></div>
    <div><label>To (lat,lng)</label><input id="to" value="28.5494,77.2510"></div>
  </div>
  <div class="row">
    <div><label>Time</label><select id="mode"><option value="depart">Depart at</option><option value="arrive">Arrive by</option></select></div>
    <div><label>Date &amp; time (IST)</label><input id="depart" type="datetime-local" value="2026-11-17T08:30"></div>
  </div>
  <div><label>Sort</label><select id="sort"><option value="fastest">Fastest</option><option value="comfort">Most comfortable</option><option value="fewer_transfers">Fewest transfers</option></select></div>
  <button id="go">Search</button>
  <div id="out"></div>
</aside>
<div id="map"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const map = L.map('map').setView([28.61, 77.21], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18, attribution: '&copy; OpenStreetMap'}).addTo(map);
const layer = L.layerGroup().addTo(map);
let clicks = 0, mFrom, mTo;
const LV = {"座れる":"Seats","立つ":"Standing","混雑":"Crowded","不明":"Unknown"};
const colors = {"座れる":"#1a7f4b","立つ":"#b7791f","混雑":"#c0392b","不明":"#98a2b3"};
function setMarkers(){
  const p = s => s.split(',').map(Number);
  if (mFrom) map.removeLayer(mFrom); if (mTo) map.removeLayer(mTo);
  mFrom = L.circleMarker(p(from.value), {radius:7, color:'#2457c5'}).addTo(map).bindTooltip('From');
  mTo = L.circleMarker(p(to.value), {radius:7, color:'#111'}).addTo(map).bindTooltip('To');
}
map.on('click', e => {
  const v = e.latlng.lat.toFixed(5)+','+e.latlng.lng.toFixed(5);
  if (clicks % 2 === 0) from.value = v; else to.value = v;
  clicks++; setMarkers();
});
function draw(o){
  layer.clearLayers();
  for (const l of o.legs) if (l.mode==='bus') {
    L.polyline(l.path, {color: colors[l.crowding.level]||'#555', weight:6, opacity:.85}).addTo(layer)
      .bindTooltip(`${l.route} ${LV[l.crowding.level]||l.crowding.level}`);
  }
  const all = o.legs.filter(l=>l.mode==='bus').flatMap(l=>l.path);
  if (all.length) map.fitBounds(L.latLngBounds(all).pad(0.2));
}
function legHtml(l){
  if (l.mode==='walk') return `<div class="leg">🚶 Walk ${l.minutes} min (${l.meters} m) ${l.to_stop? '→ '+l.to_stop : '→ destination'}</div>`;
  const c = l.crowding;
  const conf = c.confidence ? `confidence: ${c.confidence}` : '';
  let load = '';
  if (c.load != null && c.load_90ci) load = `~${c.load} on board (90% interval ${c.load_90ci[0]}–${c.load_90ci[1]})`;
  else if (c.load != null && c.load_range_assumptions) {
    const [lo, hi] = c.load_range_assumptions;
    load = lo === hi ? `avg ~${c.load} on board (capped by vehicle capacity)` : `avg ~${c.load} on board (range under assumptions ${lo}–${hi})`;
  }
  const prob = c.prob ? `seat ${Math.round(c.prob['座れる']*100)}% · standing ${Math.round(c.prob['立つ']*100)}% · crowded ${Math.round(c.prob['混雑']*100)}%` : '';
  const p85 = l.ride_min_p85 ? ` · up to ${l.ride_min_p85} min (85%)` : '';
  return `<div class="leg">🚌 <b>${l.route}</b> ${l.board.stop} → ${l.alight.stop} (${l.stops} stops)<br>
    Wait ${l.wait_min} min<span class="muted"> (${l.wait_source})</span> · Ride ${l.ride_min} min<span class="muted">${p85}</span>
    <span class="muted">(at 14:00: ${l.ride_min_at_14h} min · timetable: ${l.ride_min_timetable ?? '-'} min)</span><br>
    <span class="badge b-${c.level}">${LV[c.level]||c.level}</span> <span class="muted">${prob}</span><br>
    <span class="muted">${load} ${conf}</span></div>`;
}
async function go(){
  setMarkers();
  out.innerHTML = '<p class="muted">Searching…</p>';
  const q = new URLSearchParams({from: from.value, to: to.value, [mode.value]: depart.value, sort: sort.value});
  try {
    const r = await fetch('/journeys?' + q); const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.status);
    if (!j.options.length) { out.innerHTML = '<p>No route found.</p>'; layer.clearLayers(); return; }
    // arrive-by: show the latest departure that made it on 85% of past days
    const head = o => j.arrive_by
      ? (o.depart
          ? `<div class="big">Leave at ${o.depart} <span class="muted">arrived by ${j.arrive_by.slice(11,16)} on ${Math.round(o.on_time_share*100)}% of past days · typically arrive ${o.arrive} (${o.total_min} min) · ${o.transfers} transfer(s)</span></div>`
          : `<div class="big">No reliable departure <span class="muted">${o.transfers} transfer(s)</span></div>`)
      : `<div class="big">${o.total_min} min <span class="muted">arrive ${o.arrive}${o.arrive_safe ? ' (safe: ' + o.arrive_safe + ')' : ''} · ${o.transfers} transfer(s)</span></div>`;
    out.innerHTML = j.options.map((o,k)=>`<div class="opt" data-k="${k}">
      ${head(o)}
      ${o.unreliable ? '<div class="muted">⚠ ' + o.total_source + '</div>' : (o.total_source ? '<div class="muted">' + o.total_source + '</div>' : '')}
      ${o.safe_source && !o.arrive_safe ? '<div class="muted">⚠ ' + o.safe_source + '</div>' : ''}
      <div class="muted">walk ${o.walk_min} · wait ${o.wait_min} · ride ${o.ride_min} · perceived ${o.perceived_min} min
        <span class="badge b-${o.crowding_worst}">${LV[o.crowding_worst]||o.crowding_worst}</span></div>
      ${o.legs.map(legHtml).join('')}</div>`).join('');
    document.querySelectorAll('.opt').forEach(el => el.onclick = () => {
      document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); draw(j.options[+el.dataset.k]);
    });
    document.querySelector('.opt').click();
  } catch (e) { out.innerHTML = `<p>Error: ${e.message}</p>`; }
}
document.getElementById('go').onclick = go;
setMarkers();
</script>
</body>
</html>
